<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- This used to be a second, separately-designed list of the work. It ran on the
     old design system, so anyone who clicked "work" mid-visit was dropped out of
     the site they were reading. There is now one place the work lives: the rail
     on the homepage. This stub keeps every old inbound link alive and sends it
     there. noindex so the two lists never compete in search; follow so the link
     equity this URL has collected passes through to the homepage. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://sumeetgokhale.com/">
<meta http-equiv="refresh" content="0; url=/#work">
<title>Redirecting to the work</title>
</head>
<body>
<p>This page has moved. <a href="/#work">Continue to the work</a>.</p>
<script>location.replace("/#work");</script>
</body>
</html>
