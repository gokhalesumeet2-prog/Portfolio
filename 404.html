<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Sumeet Gokhale</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #000; --gray: #5e5e5e; --blue: #2b5be4; --blue-dark: #1e46c0;
      --band: #f7f7f7; --line: #e8e8e8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--gray); background: #fff;
      font-size: 15px; line-height: 1.6;
      min-height: 100vh;
      display: grid; place-items: center;
      padding: 40px 6%;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; text-align: center; }
    h1 { color: var(--ink); font-size: clamp(28px, 5vw, 44px); font-weight: 700; }
    .code {
      color: var(--blue); font-size: 12px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px;
    }
    p { margin-top: 14px; }
    .links { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .links a {
      background: var(--blue); color: #fff;
      font-size: 13px; font-weight: 500;
      padding: 10px 26px; border-radius: 999px; text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }
    .links a:hover { background: var(--blue-dark); transform: translateY(-1px); }
    .links a.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .links a.ghost:hover { background: var(--band); }
    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">Error 404</p>
    <h1>This page moved or never existed</h1>

    <div class="links">
      <a href="/ux-design-case-studies/">View case studies</a>
      <a class="ghost" href="/">Go home</a>
      <a class="ghost" href="mailto:gokhalesumeet2@gmail.com">Get in touch</a>
    </div>
  </main>
</body>
</html>
