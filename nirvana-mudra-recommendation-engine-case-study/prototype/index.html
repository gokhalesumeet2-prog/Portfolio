<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://sumeetgokhale.com/nirvana-mudra-recommendation-engine-case-study/">

<title>Nirvana: meditation that adapts to how you feel</title>
<style>
  /* ============================================================
     NIRVANA: DESIGN SYSTEM
     Type:    SF Pro (system): cool, light, airy, Apple-like
     Surface: white + very light grey · text: near-black + AA greys
     Accent:  soft pastels (blue / green / yellow), used sparingly
     All text meets WCAG AA (>= 4.5:1); large text & icons >= 3:1.
     ============================================================ */
  :root {
    /* soft, light accent tints (same hues, gentler) */
    --alice:      #E6EEF9;
    --alice-deep: #CFE0F4;
    --honeydew:   #E7F2E1;
    --honeydew-deep:#D3E9C8;
    --vanila:     #F0F2CC;
    --vanila-deep:#E7EA9E;

    /* neutrals: Apple-style */
    --eerie:      #1D1D1F;   /* near-black (primary / on-light 16:1) */
    --ghost:      #FBFBFD;   /* page background */
    --surface:    #F5F5F7;   /* very light grey surface */
    --ink:        #1D1D1F;   /* primary text */
    --ink-60:     #515154;   /* secondary text: 7.6:1 on white */
    --ink-40:     #6E6E73;   /* tertiary text: 4.9:1 on white (AA) */
    --line:       #E8E8ED;
    --card:       #FFFFFF;

    /* radius: soft, never boxy */
    --r-xs: 14px;
    --r-sm: 18px;
    --r-md: 22px;
    --r-lg: 26px;
    --r-xl: 32px;
    --r-pill: 999px;

    /* spacing scale (8pt) */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px; --s9: 56px;

    /* shadows: barely-there, airy */
    --sh-sm: 0 2px 10px rgba(29,29,31,.04);
    --sh-md: 0 8px 24px rgba(29,29,31,.06);
    --sh-lg: 0 18px 44px rgba(29,29,31,.08);

    --ease: cubic-bezier(.22,.61,.36,1);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1100px 700px at 50% -8%, #FFFFFF 0%, transparent 60%),
      #ECECF0;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 28px;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  /* ---------- Phone frame ---------- */
  .stage { display:flex; flex-direction:column; align-items:center; gap:18px; }
  .phone {
    position: relative;
    width: 390px; height: 844px;
    background: var(--ghost);
    border-radius: 54px;
    box-shadow: var(--sh-lg), 0 0 0 12px #101013, 0 0 0 13px #2a2a2e;
    overflow: hidden;
  }
  .notch {
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    width:128px; height:32px; background:#101013; border-radius:999px; z-index:60;
  }
  .statusbar {
    position:absolute; top:0; left:0; right:0; height:54px; z-index:55;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 30px 0; font-size:14px; font-weight:700; color:var(--ink);
    pointer-events:none;
  }
  .statusbar .sb-right { display:flex; gap:6px; align-items:center; }

  /* ---------- Screen system ---------- */
  .screens { position:absolute; inset:0; }
  .screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0; visibility:hidden;
    transform: translateX(24px);
    transition: opacity .45s var(--ease), transform .45s var(--ease), visibility .45s;
    overflow:hidden;
  }
  .screen.active { opacity:1; visibility:visible; transform:none; z-index:10; }
  .screen.back { transform: translateX(-24px); }

  .scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { width:0; }
  .pad { padding: 66px 26px 30px; }
  .pad-nav { padding-bottom: 108px; } /* room for bottom nav */

  /* ---------- Typography (SF Pro) ---------- */
  .h1 { font-size:40px; font-weight:700; letter-spacing:-1.4px; line-height:1.03; margin:0; }
  .h2 { font-size:29px; font-weight:700; letter-spacing:-1px; line-height:1.1; margin:0; }
  .h3 { font-size:21px; font-weight:600; letter-spacing:-.5px; margin:0; }
  .sub { font-size:16px; font-weight:400; color:var(--ink-60); line-height:1.5; margin:0; }
  .body { font-size:16px; font-weight:400; line-height:1.55; color:var(--ink-60); margin:0; }
  .eyebrow { font-size:12px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-40); margin:0; }
  .cap { font-size:13px; font-weight:500; color:var(--ink-40); }

  /* ---------- Buttons: one consistent pill everywhere ---------- */
  .btn {
    border:none; cursor:pointer; font-family:var(--font); font-weight:600;
    font-size:17px; border-radius:var(--r-pill); padding:16px 24px; min-height:52px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .18s var(--ease), box-shadow .25s var(--ease), background .25s, opacity .25s;
    width:100%; letter-spacing:-0.2px;
  }
  .btn:active { transform: scale(.97); }
  .btn-dark { background:var(--eerie); color:#fff; }
  .btn-dark:active { opacity:.9; }
  .btn-accent { background:var(--vanila-deep); color:var(--eerie); }
  .btn-light { background:var(--surface); color:var(--eerie); }
  .btn-light:active { background:var(--line); }
  .btn-ghost { background:transparent; color:var(--ink-60); font-weight:500; min-height:auto; }
  .btn[disabled] { opacity:.32; pointer-events:none; }

  .iconbtn {
    width:52px; height:52px; border-radius:var(--r-pill); border:none; cursor:pointer;
    background:var(--eerie); color:#fff; display:flex; align-items:center; justify-content:center;
    transition: transform .18s var(--ease), background .25s; flex:none;
  }
  .iconbtn:active { transform: scale(.9); }
  .iconbtn.soft { background:var(--surface); color:var(--eerie); }
  .iconbtn.accent { background:var(--vanila-deep); color:var(--eerie); }

  .icon { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .icon-lg { width:26px; height:26px; }

  /* ---------- Cards / chips ---------- */
  .card { background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh-sm); padding:20px; }
  .chip {
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font-family:var(--font); font-weight:500; font-size:15px;
    padding:12px 18px; border-radius:var(--r-pill); cursor:pointer;
    transition: all .22s var(--ease); display:inline-flex; align-items:center; gap:8px;
    transform: scale(1); letter-spacing:-0.2px;
  }
  .chip:active { transform: scale(.94); }
  .chip.sel { background:var(--eerie); color:#fff; border-color:var(--eerie); }

  .dots { display:flex; gap:7px; justify-content:center; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--ink-40); opacity:.3; transition:all .3s var(--ease); }
  .dots i.on { opacity:1; width:22px; border-radius:6px; background:var(--eerie); }

  /* progress ring */
  .ring { transform: rotate(-90deg); }
  .ring circle { fill:none; stroke-width:7; stroke-linecap:round; }

  /* ---------- Bottom nav ---------- */
  .bottomnav {
    position:absolute; left:16px; right:16px; bottom:16px; height:72px; z-index:40;
    background:rgba(255,255,255,.86); backdrop-filter:blur(18px);
    border-radius:var(--r-xl); box-shadow:var(--sh-md);
    display:flex; align-items:center; justify-content:space-around; padding:0 8px;
    border:1px solid rgba(255,255,255,.7);
  }
  .navitem { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; color:var(--ink-40); background:none; border:none; font-family:var(--font); transition:color .2s; padding:8px 12px; border-radius:18px; }
  .navitem span { font-size:11px; font-weight:600; }
  .navitem.on { color:var(--eerie); }
  .navitem.on .navpill { background:var(--vanila); }
  .navpill { width:44px; height:34px; border-radius:14px; display:flex; align-items:center; justify-content:center; transition:background .25s; }

  /* utility */
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}.gap5{gap:20px}
  .col { display:flex; flex-direction:column; }
  .wrap { display:flex; flex-wrap:wrap; gap:11px; }
  .mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}.mt6{margin-top:24px}.mt7{margin-top:32px}.mt8{margin-top:40px}
  .grow{flex:1}
  .center{align-items:center;justify-content:center}
  .txt-c{text-align:center}
  .sticky-cta { padding:14px 26px calc(env(safe-area-inset-bottom) + 22px); background:linear-gradient(180deg, rgba(246,245,250,0) 0%, var(--ghost) 26%); }

  /* fades / motion */
  @keyframes fadeUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
  .fu { animation: fadeUp .55s var(--ease) both; }
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}

  @keyframes breathe {
    0%,100% { transform: scale(.82); opacity:.55; }
    50%     { transform: scale(1.12); opacity:1; }
  }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  /* pill segmented */
  .seg { background:#fff; border-radius:var(--r-pill); padding:5px; display:flex; box-shadow:var(--sh-sm); }
  .seg button { flex:1; border:none; background:none; font-family:var(--font); font-weight:600; font-size:14px; color:var(--ink-60); padding:11px; border-radius:var(--r-pill); cursor:pointer; transition:all .25s var(--ease); }
  .seg button.on { background:var(--eerie); color:#fff; }

  /* toast */
  .toast { position:absolute; bottom:104px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--eerie); color:#fff; padding:13px 20px; border-radius:var(--r-pill); font-size:14px; font-weight:600; box-shadow:var(--sh-md); opacity:0; transition:all .35s var(--ease); z-index:80; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .hint { color:var(--ink-40); font-size:13px; font-weight:500; text-align:center; }
  .caption-under { max-width:320px; }

  /* dark mode */
  .phone.dark { --ghost:#141416; --card:#1E1E22; --ink:#F4F4F6; --ink-60:#A6A6AE; --ink-40:#75757C; --line:#2C2C31; }
  .phone.dark body {}
  .phone.dark .btn-light{ background:#26262b; color:#fff;}
  .phone.dark .chip{ background:#1E1E22; }
  .phone.dark .bottomnav{ background:rgba(30,30,34,.8); border-color:rgba(255,255,255,.06);}
</style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="statusbar">
        <span id="clock">9:41</span>
        <span class="sb-right">
          <svg class="icon" style="width:17px;height:17px" viewBox="0 0 24 24"><path d="M2 20h.01M6 20v-4M10 20v-8M14 20V8M18 20V4"/></svg>
          <svg class="icon" style="width:17px;height:17px" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
          <svg style="width:24px;height:13px" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#212121" stroke-width="1.4"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#212121"/><path d="M24 4.5v4a2 2 0 0 0 0-4Z" fill="#212121"/></svg>
        </span>
      </div>

      <div class="screens" id="screens"><!-- screens injected by JS --></div>
      <div class="toast" id="toast"></div>
    </div>
    <div style="font-family:var(--font);color:#9A9AA0;font-size:13px;font-weight:600;letter-spacing:.3px">Nirvana · interactive prototype · tap through the flow</div>
  </div>

<script>
/* ================================================================
   NIRVANA: prototype logic
   State: onboarding progress · selected symptoms · duration ·
          recommendation engine · player · profile
   ================================================================ */

const state = {
  name: 'Sumeet',
  symptoms: [],
  mood: null,          // quick mood chosen on Home (overrides symptom for the hero)
  duration: null,
  music: null,
  streak: 7,
  minutes: 428,
  sessionsDone: 34,
  history: [
    { m:'gyan', when:'Today, 7:30 AM' },
    { m:'dhyana', when:'Yesterday, 10:40 PM' },
    { m:'vayu', when:'Mon, 8:15 AM' },
  ],
};

const SYMPTOMS = ['Stress','Anxiety','Overthinking','Brain Fog','Low Energy','Anger','Burnout','Lack of Focus','Poor Sleep','Emotional Exhaustion','Loneliness','Restlessness','Procrastination','Self Doubt','Social Anxiety'];

/* ================================================================
   MUDRA LIBRARY : the heart of Nirvana.
   Each mudra defines the hand position (for the diagram), its element,
   what it helps with, and a calm tone from the design system.
   hand: fingertips that TOUCH the thumb (active) and any FOLDED fingers.
   ================================================================ */
const MUDRAS = {
  gyan:    { name:'Gyan Mudra',    sk:'Jñāna · gesture of knowledge', tone:'alice',    element:'Air',   for:'Focus · calm · clarity',
             how:'Rest the tip of your index finger on the tip of your thumb. Let the other three fingers extend, soft and open.',
             benefit:'Quiets mental chatter and gathers a scattered mind into steady, gentle focus.',
             hand:{ active:['index'], folded:[] } },
  prana:   { name:'Prana Mudra',   sk:'Prāṇa · gesture of life',      tone:'vanila',   element:'Earth+Water', for:'Energy · vitality',
             how:'Bring the tips of your ring and little fingers to meet your thumb. Keep index and middle fingers straight.',
             benefit:'Awakens dormant energy and lifts fatigue. A natural, caffeine-free recharge.',
             hand:{ active:['ring','little'], folded:[] } },
  vayu:    { name:'Vayu Mudra',    sk:'Vāyu · gesture of air',        tone:'alice',    element:'Air',   for:'Anxiety · restlessness',
             how:'Fold your index finger toward the palm and press it gently with your thumb. Other fingers stay relaxed.',
             benefit:'Settles nervous, restless energy and eases an over-active, anxious mind.',
             hand:{ active:[], folded:['index'] } },
  dhyana:  { name:'Dhyana Mudra',  sk:'Dhyāna · gesture of meditation', tone:'alice',  element:'Stillness', for:'Deep calm · sleep',
             how:'Rest both hands in your lap, right over left, palms up, thumb-tips lightly touching.',
             benefit:'Invites deep stillness and prepares the body for rest and sleep.',
             hand:{ active:[], folded:[], open:true } },
  shuni:   { name:'Shuni Mudra',   sk:'Śūnya · gesture of patience',  tone:'honeydew', element:'Ether', for:'Patience · anger',
             how:'Touch the tip of your middle finger to the tip of your thumb. Keep the rest extended.',
             benefit:'Cools heat and reactivity, restoring patience and composure.',
             hand:{ active:['middle'], folded:[] } },
  prithvi: { name:'Prithvi Mudra', sk:'Pṛthvī · gesture of earth',    tone:'honeydew', element:'Earth', for:'Grounding · confidence',
             how:'Bring the tip of your ring finger to the tip of your thumb. Let the others rest open.',
             benefit:'Grounds and steadies you, building quiet self-trust and confidence.',
             hand:{ active:['ring'], folded:[] } },
  buddhi:  { name:'Buddhi Mudra',  sk:'Buddhi · gesture of clarity',  tone:'vanila',   element:'Water', for:'Clarity · communication',
             how:'Touch the tip of your little finger to the tip of your thumb. Keep the others extended.',
             benefit:'Clears mental fog and opens up calm, intuitive communication.',
             hand:{ active:['little'], folded:[] } },
  anjali:  { name:'Anjali Mudra',  sk:'Añjali · gesture of the heart', tone:'honeydew', element:'Heart', for:'Centering · gratitude',
             how:'Press your palms together at the centre of your chest, fingers pointing up, shoulders soft.',
             benefit:'Brings you back to your centre and opens a quiet sense of gratitude and connection.',
             hand:{ active:[], folded:[], open:true } },
  surya:   { name:'Surya Mudra',   sk:'Sūrya · gesture of the sun',   tone:'vanila',   element:'Fire',  for:'Warmth · morning energy',
             how:'Fold your ring finger down and press it with your thumb. Keep the other fingers extended.',
             benefit:'Kindles inner warmth and a bright, awake feeling to meet the morning.',
             hand:{ active:[], folded:['ring'] } },
  apana:   { name:'Apana Mudra',   sk:'Apāna · gesture of release',   tone:'honeydew', element:'Earth', for:'Release · emotional reset',
             how:'Bring the tips of your middle and ring fingers to your thumb. Index and little stay open.',
             benefit:'Helps you let go of what you are carrying and reset when emotionally drained.',
             hand:{ active:['middle','ring'], folded:[] } },
};

/* Feeling (symptom or quick mood) → mudra id */
const FEELING_MUDRA = {
  'Stress':'gyan', 'Anxiety':'vayu', 'Overthinking':'gyan', 'Brain Fog':'buddhi',
  'Low Energy':'prana', 'Anger':'shuni', 'Burnout':'prana', 'Lack of Focus':'gyan',
  'Poor Sleep':'dhyana', 'Emotional Exhaustion':'apana', 'Loneliness':'anjali',
  'Restlessness':'vayu', 'Procrastination':'prithvi', 'Self Doubt':'prithvi', 'Social Anxiety':'buddhi',
  // quick moods
  'Calm':'gyan', 'Focused':'gyan', 'Tired':'prana', 'Anxious':'vayu', 'Grateful':'anjali',
};

/* Time of day shapes the suggestion too */
function timeBucket(h){ return h<5?'night':h<12?'morning':h<17?'midday':h<22?'evening':'night'; }
const TIME_DEFAULT = { morning:'surya', midday:'gyan', evening:'apana', night:'dhyana' };
const TIME_LABEL = { morning:'this morning', midday:'this afternoon', evening:'this evening', night:'tonight' };
const ENERGIZING = ['prana','surya','gyan','buddhi'];

/* The mudra recommendation engine: feeling + time of day → the perfect mudra */
function recommendation(){
  const h = new Date().getHours();
  const bucket = timeBucket(h);
  const feeling = state.mood || state.symptoms[0] || null;
  let id = feeling ? FEELING_MUDRA[feeling] : TIME_DEFAULT[bucket];
  let why;
  if (feeling){
    why = `You're feeling ${feeling.toLowerCase()} ${TIME_LABEL[bucket]}`;
    // At night, gently swap an energizing mudra for a calming wind-down
    if ((bucket==='night'||bucket==='evening') && ENERGIZING.includes(id) && feeling!=='Focused'){
      id = bucket==='night' ? 'dhyana' : 'apana';
      why = `It's late and you're feeling ${feeling.toLowerCase()}, time to wind down`;
    }
  } else {
    why = `A calm fit for ${TIME_LABEL[bucket]}`;
  }
  const durations = { 5:'5 min', 10:'10 min', 15:'15 min' };
  const mins = state.duration || (bucket==='morning'?5:bucket==='night'?10:10);
  return { id, ...MUDRAS[id], mins, why, bucket };
}

/* Browse the full library by intention → each opens a mudra */
const CATEGORIES = [
  { t:'Focus & Clarity',   mud:'gyan',    ic:'target' },
  { t:'Energy & Vitality', mud:'prana',   ic:'sun' },
  { t:'Calm Anxiety',      mud:'vayu',    ic:'wind' },
  { t:'Deep Sleep',        mud:'dhyana',  ic:'moon' },
  { t:'Patience',          mud:'shuni',   ic:'leaf' },
  { t:'Grounding',         mud:'prithvi', ic:'spark' },
  { t:'Communication',     mud:'buddhi',  ic:'eye' },
  { t:'Gratitude',         mud:'anjali',  ic:'heart' },
  { t:'Morning Warmth',    mud:'surya',   ic:'zap' },
  { t:'Emotional Release', mud:'apana',   ic:'lotus' },
];

const toneBg = { alice:'var(--alice)', honeydew:'var(--honeydew)', vanila:'var(--vanila)' };

/* ---------- Hand-position diagram (schematic, on-brand) ---------- */
function handSVG(hand, size){
  const active = (hand && hand.active) || [];
  const folded = (hand && hand.folded) || [];
  const open = hand && hand.open;
  const fingers = { index:{x:42,y:30,w:14,h:58}, middle:{x:59,y:22,w:14,h:66}, ring:{x:76,y:30,w:14,h:58}, little:{x:92,y:44,w:12,h:44} };
  const tips = { thumb:[24,60], index:[49,32], middle:[66,24], ring:[83,32], little:[98,46] };
  let p = '';
  p += '<ellipse cx="66" cy="96" rx="34" ry="28" fill="var(--eerie)"/>';
  p += '<rect x="40" y="104" width="52" height="24" rx="12" fill="var(--eerie)"/>';
  for (const k in fingers){
    const f = fingers[k];
    if (folded.includes(k)) p += `<rect x="${f.x}" y="${f.y+f.h-24}" width="${f.w}" height="24" rx="${f.w/2}" fill="var(--eerie)"/>`;
    else p += `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="${f.w/2}" fill="var(--eerie)"/>`;
  }
  p += '<rect x="16" y="58" width="14" height="48" rx="7" fill="var(--eerie)" transform="rotate(-38 23 82)"/>';
  const [tx,ty] = tips.thumb;
  if (open){
    // resting / palms style: a soft accent glow at the centre
    p += '<circle cx="66" cy="70" r="10" fill="var(--vanila-deep)" stroke="#fff" stroke-width="3"/>';
  } else {
    active.forEach(k=>{ const [x,y]=tips[k]; p += `<line x1="${tx}" y1="${ty}" x2="${x}" y2="${y}" stroke="var(--vanila-deep)" stroke-width="4" stroke-linecap="round"/>`; });
    active.forEach(k=>{ const [x,y]=tips[k]; p += `<circle cx="${x}" cy="${y}" r="8" fill="var(--vanila-deep)" stroke="#fff" stroke-width="2.5"/>`; });
    if (active.length) p += `<circle cx="${tx}" cy="${ty}" r="8" fill="var(--vanila-deep)" stroke="#fff" stroke-width="2.5"/>`;
    folded.forEach(k=>{ const f=fingers[k]; const cx=f.x+f.w/2, cy=f.y+f.h-24; p += `<circle cx="${cx}" cy="${cy}" r="7" fill="none" stroke="var(--vanila-deep)" stroke-width="3.5"/>`; });
  }
  const s = size||120;
  return `<svg width="${s}" height="${s*1.05}" viewBox="0 0 120 128" fill="none">${p}</svg>`;
}

/* ---------- SVG icon set (thin, minimal) ---------- */
const I = {
  arrow:  '<path d="M5 12h14M13 6l6 6-6 6"/>',

function go(id, back=false){
  const screens = document.querySelectorAll('.screen');
  screens.forEach(s => {
    if(s.id === 'sc-'+id){ s.classList.remove('back'); s.classList.add('active'); }
    else if(s.classList.contains('active')){ s.classList.add('back'); s.classList.remove('active'); }
  });
  current = id;
  if(id==='home') renderHome();
  if(id==='player') renderPlayer();
  if(id==='profile') renderProfile();
  if(id==='discover') renderDiscover();
  if(id==='library') renderLibrary();
  document.querySelector('#sc-'+id+' .scroll')?.scrollTo(0,0);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1900);
}

        <button class="col" style="flex:none;width:150px;height:180px;border-radius:var(--r-lg);background:${toneBg[MUDRAS[c.mud].tone]};border:none;cursor:pointer;padding:16px;justify-content:space-between;align-items:flex-start;box-shadow:var(--sh-sm)" onclick="startMudra('${c.mud}')">
          <div style="width:100%;display:flex;justify-content:center">${handSVG(MUDRAS[c.mud].hand, 66)}</div>

function statCard(ic, val, label, tone){

    <div class="col"><span class="h3" style="font-size:22px">${val}</span><span class="cap" style="font-weight:600">${label}</span></div>
  </div>`;
}
function statWide(){
  return `<div class="card row between" style="align-items:center;padding:18px" onclick="go('profile')">
    <div class="row gap3"><div style="width:46px;height:46px;border-radius:14px;background:var(--alice);display:flex;align-items:center;justify-content:center;color:var(--eerie)">${svg(I.award)}</div>
    <div class="col"><span class="h3" style="font-size:17px">Achievements</span><span class="cap" style="font-weight:600">3 new badges this week</span></div></div>

}
function quickMood(m){ state.mood = (state.mood===m? null : m); renderHome(); }

/* ---- Player: a guided MUDRA practice ---- */
let player_state = { mud:'gyan', mins:10, playing:false, elapsed:0, timer:null };
function startMudra(id, mins){
  const mud = MUDRAS[id] || MUDRAS['gyan'];
  player_state = { mud:id, mins: mins || state.duration || (mud.hand.open?10:10), playing:true, elapsed:0, timer:null };
  go('player');
}
function renderPlayer(){
  const ps = player_state;
  const m = MUDRAS[ps.mud];
  const el = document.getElementById('playerbody');
  el.innerHTML = `
    <div style="flex:1;display:flex;flex-direction:column;background:
        radial-gradient(700px 500px at 50% 22%, ${toneBg[m.tone]} 0%, transparent 62%),
        linear-gradient(180deg, var(--ghost), #EAEAEF); position:relative; overflow:hidden">
      <div class="pad" style="padding-top:66px;padding-bottom:0">
        <div class="row between">
          <button class="iconbtn soft" style="width:44px;height:44px" onclick="stopSession()">${svg(I.back)}</button>
          <span class="cap" style="font-weight:700;color:var(--ink)">Mudra Practice</span>
          <button class="iconbtn soft" style="width:44px;height:44px" onclick="toast(favd? 'Removed from favourites':'Saved to favourites')" id="favbtn">${svg(I.heart)}</button>
        </div>
      </div>

      <div class="grow center col" style="gap:14px">
        <div style="position:relative;width:250px;height:250px;display:flex;align-items:center;justify-content:center">
          <div id="b1" style="position:absolute;inset:0;border-radius:50%;background:${toneBg[m.tone]};opacity:.55;animation:breathe 8s var(--ease) infinite ${ps.playing?'running':'paused'}"></div>
          <div id="b2" style="position:absolute;inset:30px;border-radius:50%;background:#fff;opacity:.8;animation:breathe 8s var(--ease) infinite .8s ${ps.playing?'running':'paused'}"></div>
          <div style="position:absolute;inset:56px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center">${handSVG(m.hand, 118)}</div>
        </div>
        <span class="cap" style="font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:11px" id="breathword">Breathe in</span>
      </div>

      <div class="pad" style="padding-bottom:34px">
        <div class="txt-c">
          <span class="cap" style="font-weight:600">${m.for} · ${m.element}</span>
          <h2 class="h2 mt2">${m.name}</h2>
        </div>

        <div class="card mt5" style="padding:16px 18px;text-align:left">
          <span class="eyebrow" style="color:var(--ink-40)">Hold this mudra</span>
          <p class="body mt2" style="font-size:15px;color:var(--ink)">${m.how}</p>
        </div>

        <div class="mt5">
          <div style="height:6px;border-radius:99px;background:rgba(33,33,33,.1);overflow:hidden">
            <div id="pbar" style="height:100%;width:0%;background:var(--eerie);border-radius:99px;transition:width .5s linear"></div>
          </div>
          <div class="row between mt2">
            <span class="cap" style="font-weight:600" id="tcur">0:00</span>
            <span class="cap" style="font-weight:600">${ps.mins}:00</span>
          </div>
        </div>

        <div class="row center gap5 mt5">
          <button class="iconbtn soft" onclick="seek(-15)">${svg(I.prev)}</button>
          <button class="iconbtn accent" id="playbtn" style="width:74px;height:74px" onclick="togglePlay()">${svg(ps.playing?I.pause:I.play,'icon-lg')}</button>
          <button class="iconbtn soft" onclick="seek(15)">${svg(I.next)}</button>
        </div>
        <div class="row center mt4">
          <span class="cap" style="font-weight:600">${state.music? svg(I.music)+' '+state.music : svg(I.music)+' Nirvana ambience'}</span>
        </div>
      </div>
    </div>`;
  startTimer();
  animateBreath();
}
let favd=false;
let breathTimer=null;
function animateBreath(){
  clearInterval(breathTimer);
  const words=['Breathe in','Hold','Breathe out','Hold'];
  let i=0;
  const w=document.getElementById('breathword');
  breathTimer=setInterval(()=>{ if(!player_state.playing) return; i=(i+1)%4; if(w) w.textContent=words[i]; }, 2000);
}
function startTimer(){
  clearInterval(player_state.timer);
  const total = player_state.mins*60;
  player_state.timer = setInterval(()=>{
    if(!player_state.playing) return;
    player_state.elapsed++;
    if(player_state.elapsed>=total){ player_state.elapsed=total; player_state.playing=false; clearInterval(player_state.timer); toast('Session complete, well done'); }
    updatePlayer(total);
  }, 250); // sped up 4x for demo
}
function updatePlayer(total){
  const pct = Math.min(100, player_state.elapsed/total*100);
  const bar = document.getElementById('pbar'); if(bar) bar.style.width=pct+'%';
  const cur = document.getElementById('tcur');
  if(cur){ const m=Math.floor(player_state.elapsed/60), s=player_state.elapsed%60; cur.textContent=m+':'+String(s).padStart(2,'0'); }
}
function togglePlay(){
  player_state.playing=!player_state.playing;
  document.getElementById('playbtn').innerHTML=svg(player_state.playing?I.pause:I.play,'icon-lg');
  document.querySelectorAll('#b1,#b2').forEach(b=>b.style.animationPlayState=player_state.playing?'running':'paused');
}
function seek(sec){
  const total=player_state.mins*60;
  player_state.elapsed=Math.max(0,Math.min(total,player_state.elapsed+sec));
  updatePlayer(total); toast(sec>0?'Skipped 15s':'Back 15s');
}
function stopSession(){ clearInterval(player_state.timer); clearInterval(breathTimer); go('home', true); }
document.addEventListener('click', e=>{ if(e.target.closest('#favbtn')){ favd=!favd; const b=e.target.closest('#favbtn'); b.style.background=favd?'var(--vanila)':'#fff'; } });

}
function prefRow(ic, title, sub, toggle, onToggle){
  const t = toggle===null ? svg(I.chevr) :
    `<button class="tgl" onclick="${onToggle||'this.classList.toggle(\'on\')'}" style="width:52px;height:30px;border-radius:99px;border:none;cursor:pointer;background:${toggle?'var(--eerie)':'var(--line)'};position:relative;transition:background .25s" data-on="${toggle}">
      <span style="position:absolute;top:3px;left:${toggle?'25px':'3px'};width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s"></span></button>`;
  return `<div class="row between" style="padding:14px 0;align-items:center">
    <div class="row gap3"><div style="width:42px;height:42px;border-radius:13px;background:var(--ghost);display:flex;align-items:center;justify-content:center;color:var(--eerie)">${svg(ic)}</div>
    <div class="col"><span style="font-weight:700;font-size:16px">${title}</span><span class="cap" style="font-weight:600;margin-top:2px">${sub}</span></div></div>
    ${t}
  </div>`;
}
function toggleDark(btn){
  const on = btn.getAttribute('data-on')==='true';
  const nx = !on; btn.setAttribute('data-on', nx);
  btn.style.background = nx?'var(--eerie)':'var(--line)';
  btn.querySelector('span').style.left = nx?'25px':'3px';
  document.getElementById('phone').classList.toggle('dark', nx);
}
function resetFlow(){ state.symptoms=[]; state.duration=null; state.music=null; state.mood=null;

  document.getElementById('durcta').disabled=true;
  go('splash');
}
