<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-label="Nirvana mudra app home screen showing a recommended hand gesture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7F2E1"/>
      <stop offset="52%" stop-color="#E6EEF9"/>
      <stop offset="100%" stop-color="#F0F2CC"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1D2430" flood-opacity=".22"/>
    </filter>
    <clipPath id="screenClip"><rect x="10" y="10" width="188" height="372" rx="24"/></clipPath>
  </defs>

  <rect width="600" height="500" fill="url(#bg)"/>
  <circle cx="110" cy="94" r="128" fill="#ffffff" opacity=".34"/>
  <circle cx="518" cy="410" r="152" fill="#ffffff" opacity=".26"/>
  <circle cx="492" cy="112" r="54" fill="#ffffff" opacity=".3"/>

  <!-- large mudra glyph, ghosted into the background -->
  <g transform="translate(392 156) scale(1.5)" opacity=".13">
    <ellipse cx="66" cy="96" rx="34" ry="28" fill="#1D1D1F"/>
    <rect x="40" y="104" width="52" height="24" rx="12" fill="#1D1D1F"/>
    <rect x="42" y="30" width="14" height="58" rx="7" fill="#1D1D1F"/>
    <rect x="59" y="22" width="14" height="66" rx="7" fill="#1D1D1F"/>
    <rect x="76" y="30" width="14" height="58" rx="7" fill="#1D1D1F"/>
    <rect x="92" y="44" width="12" height="44" rx="6" fill="#1D1D1F"/>
    <rect x="16" y="58" width="14" height="48" rx="7" fill="#1D1D1F" transform="rotate(-38 23 82)"/>
  </g>

  <!-- phone -->
  <g transform="translate(148 46) rotate(-5)" filter="url(#soft)">
    <rect x="0" y="0" width="208" height="392" rx="34" fill="#101013"/>
    <rect x="10" y="10" width="188" height="372" rx="24" fill="#FBFBFD"/>
    <rect x="84" y="18" width="40" height="8" rx="4" fill="#101013"/>

    <g clip-path="url(#screenClip)">
      <rect x="30" y="48" width="60" height="7"  rx="3.5" fill="#C7C7CC"/>
      <rect x="30" y="63" width="96" height="13" rx="6.5" fill="#1D1D1F"/>

      <rect x="30" y="96" width="148" height="158" rx="18" fill="#E6EEF9"/>
      <circle cx="178" cy="104" r="44" fill="#ffffff" opacity=".42"/>
      <rect x="44" y="110" width="50" height="6"  rx="3" fill="#1D1D1F" opacity=".42"/>
      <rect x="44" y="126" width="74" height="12" rx="6" fill="#1D1D1F"/>
      <rect x="44" y="145" width="56" height="6"  rx="3" fill="#1D1D1F" opacity=".38"/>

      <g transform="translate(116 112) scale(0.42)">
        <rect x="-16" y="-12" width="132" height="126" rx="26" fill="#ffffff" opacity=".84"/>
        <ellipse cx="66" cy="96" rx="34" ry="28" fill="#1D1D1F"/>
        <rect x="40" y="104" width="52" height="18" rx="9" fill="#1D1D1F"/>
        <rect x="42" y="30" width="14" height="58" rx="7" fill="#1D1D1F"/>
        <rect x="59" y="22" width="14" height="66" rx="7" fill="#1D1D1F"/>
        <rect x="76" y="30" width="14" height="58" rx="7" fill="#1D1D1F"/>
        <rect x="92" y="44" width="12" height="44" rx="6" fill="#1D1D1F"/>
        <rect x="16" y="58" width="14" height="48" rx="7" fill="#1D1D1F" transform="rotate(-38 23 82)"/>
        <line x1="24" y1="60" x2="49" y2="32" stroke="#E7EA9E" stroke-width="6.5" stroke-linecap="round"/>
        <circle cx="49" cy="32" r="10.5" fill="#E7EA9E" stroke="#fff" stroke-width="3"/>
        <circle cx="24" cy="60" r="10.5" fill="#E7EA9E" stroke="#fff" stroke-width="3"/>
      </g>

      <rect x="44" y="174" width="112" height="6" rx="3" fill="#1D1D1F" opacity=".28"/>
      <rect x="44" y="187" width="84"  height="6" rx="3" fill="#1D1D1F" opacity=".28"/>

      <rect x="44" y="204" width="46" height="18" rx="9" fill="#ffffff"/>
      <rect x="96" y="204" width="62" height="18" rx="9" fill="#ffffff"/>
      <rect x="82" y="230" width="76" height="16" rx="8" fill="#1D1D1F"/>

      <rect x="30" y="274" width="66" height="56" rx="15" fill="#E7F2E1"/>
      <rect x="102" y="274" width="66" height="56" rx="15" fill="#F0F2CC"/>
      <rect x="174" y="274" width="42" height="56" rx="15" fill="#E6EEF9"/>

      <rect x="62" y="356" width="84" height="7" rx="3.5" fill="#1D1D1F" opacity=".16"/>
    </g>
    <rect x="10" y="10" width="188" height="372" rx="24" fill="url(#glass)"/>
  </g>
</svg>
