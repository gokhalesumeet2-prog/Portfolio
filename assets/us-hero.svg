<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-label="Three Unsmoke app screens: the home screen with a 14 day streak card and a health meter, the urge screen showing a flask of water at 98 percent purity, and the support network screen with educational resources unlocked by streaks.">
  <defs>
    <clipPath id="us-p1"><rect x="120" y="120" width="300" height="600" rx="34"/></clipPath>
    <clipPath id="us-p2"><rect x="550" y="120" width="300" height="600" rx="34"/></clipPath>
    <clipPath id="us-p3"><rect x="980" y="120" width="300" height="600" rx="34"/></clipPath>
    <linearGradient id="us-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fd3e2"/>
      <stop offset="100%" stop-color="#45b3c6"/>
    </linearGradient>
  </defs>

  <style>
    .us-dark  { fill:#272d2d; }
    .us-gold  { fill:#e3b04b; }
    .us-cream { fill:#f6f1e6; }
    .us-teal  { fill:#2d5f6e; }
    .us-w     { fill:#ffffff; }
    .us-t     { font-family:"Inter",-apple-system,system-ui,sans-serif; }
    .us-lbl   { font-size:12px; font-weight:600; letter-spacing:.14em; }
    .us-hd    { font-size:19px; font-weight:600; }
    .us-sm    { font-size:11px; }
    .us-xs    { font-size:9.5px; }
    .us-dim   { fill:#ffffff; opacity:.62; }
    .us-ink   { fill:#272d2d; }
    .us-shell { fill:none; stroke:#d3d8dc; stroke-width:1.5; }
  </style>

  <rect width="1400" height="820" fill="#f0f2f4"/>

  <!-- ══════════ PHONE 1 — home, streak and health meter ══════════ -->
  <g clip-path="url(#us-p1)">
    <rect x="120" y="120" width="300" height="600" class="us-dark"/>

    <!-- status / nav bar -->
    <path d="M144 152h16M144 158h22M144 164h13" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <text x="205" y="163" class="us-t us-lbl" fill="#fff">UNSMOKE</text>
    <rect x="288" y="151" width="9" height="13" class="us-gold"/>
    <rect x="300" y="151" width="9" height="13" fill="#fff" opacity=".9"/>
    <rect x="312" y="151" width="9" height="13" class="us-gold"/>
    <rect x="324" y="151" width="9" height="13" class="us-gold"/>
    <circle cx="386" cy="158" r="13" fill="#4a5450"/>
    <circle cx="386" cy="153" r="4.5" fill="#c9b8a4"/>
    <path d="M377 168a9 9 0 0 1 18 0z" fill="#c9b8a4"/>

    <text x="144" y="205" class="us-t us-hd" fill="#fff">Welcome back, Dan!</text>
    <text x="144" y="223" class="us-t us-sm us-dim">Where would you like to start?</text>

    <!-- streak card -->
    <rect x="144" y="243" width="252" height="104" rx="10" class="us-cream"/>
    <text x="160" y="268" class="us-t us-ink" font-size="13" font-weight="600">Unsmoke streak 1</text>
    <text x="160" y="286" class="us-t us-xs" fill="#5c6360">Start your 14 day streak right away!</text>
    <text x="160" y="299" class="us-t us-xs" fill="#5c6360">Dont worry we got your back!</text>
    <rect x="160" y="311" width="66" height="23" rx="5" class="us-teal"/>
    <text x="193" y="326" class="us-t" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Start</text>
    <circle cx="352" cy="292" r="26" class="us-gold" opacity=".9"/>
    <rect x="340" y="281" width="24" height="20" rx="3" fill="#3a4340"/>
    <circle cx="346" cy="291" r="3" fill="#e3b04b"/>
    <circle cx="357" cy="288" r="2" fill="#e3b04b"/>
    <circle cx="358" cy="295" r="2" fill="#e3b04b"/>

    <!-- community card -->
    <rect x="144" y="359" width="252" height="98" rx="10" class="us-cream"/>
    <text x="160" y="384" class="us-t us-ink" font-size="13" font-weight="600">Community uplifting</text>
    <text x="160" y="402" class="us-t us-xs" fill="#5c6360">Connect with your herd of</text>
    <text x="160" y="415" class="us-t us-xs" fill="#5c6360">non-smokers to achieve benefits</text>
    <rect x="160" y="424" width="80" height="23" rx="5" class="us-teal"/>
    <text x="200" y="439" class="us-t" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Connect</text>
    <g fill="#3a4340">
      <circle cx="330" cy="392" r="6"/><rect x="325" y="399" width="10" height="16" rx="4"/>
      <circle cx="352" cy="387" r="6"/><rect x="347" y="394" width="10" height="21" rx="4"/>
      <circle cx="373" cy="393" r="6"/><rect x="368" y="400" width="10" height="15" rx="4"/>
    </g>

    <!-- health meter -->
    <rect x="144" y="486" width="252" height="7" rx="3.5" fill="#3d4644"/>
    <rect x="144" y="486" width="252" height="7" rx="3.5" fill="#4caf50"/>
    <text x="270" y="512" class="us-t us-sm" fill="#fff" text-anchor="middle" font-style="italic">Health meter</text>
    <text x="270" y="529" class="us-t" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-style="italic">100%</text>

    <!-- tab bar -->
    <g stroke="#fff" stroke-width="1.6" fill="none" opacity=".85">
      <circle cx="176" cy="676" r="7"/><path d="M170 682l12-12"/>
      <circle cx="266" cy="672" r="5"/><path d="M258 684a8 8 0 0 1 16 0"/>
      <circle cx="282" cy="672" r="5"/><path d="M276 684a8 8 0 0 1 14 0"/>
      <circle cx="364" cy="671" r="6"/><path d="M355 684a9 9 0 0 1 18 0"/>
    </g>
  </g>
  <rect x="120" y="120" width="300" height="600" rx="34" class="us-shell"/>

  <!-- ══════════ PHONE 2 — the water vessel ══════════ -->
  <g clip-path="url(#us-p2)">
    <rect x="550" y="120" width="300" height="600" class="us-dark"/>

    <path d="M574 152h16M574 158h22M574 164h13" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <text x="635" y="163" class="us-t us-lbl" fill="#fff">UNSMOKE</text>
    <rect x="718" y="151" width="9" height="13" class="us-gold"/>
    <rect x="730" y="151" width="9" height="13" fill="#fff" opacity=".9"/>
    <rect x="742" y="151" width="9" height="13" class="us-gold"/>
    <rect x="754" y="151" width="9" height="13" class="us-gold"/>
    <circle cx="816" cy="158" r="13" fill="#4a5450"/>
    <circle cx="816" cy="153" r="4.5" fill="#c9b8a4"/>
    <path d="M807 168a9 9 0 0 1 18 0z" fill="#c9b8a4"/>

    <text x="574" y="202" class="us-t us-sm" fill="#fff">Each time you smoke, the water</text>
    <text x="574" y="218" class="us-t us-sm" fill="#fff">gets <tspan font-weight="700">muddier</tspan>. This water represents</text>
    <text x="574" y="234" class="us-t us-sm" fill="#fff">your health at present.</text>

    <!-- flask -->
    <g>
      <path d="M683 268h34v46l44 92a20 20 0 0 1-18 29h-86a20 20 0 0 1-18-29l44-92z"
            fill="#5ec8d8" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <path d="M683 268h34v46l44 92a20 20 0 0 1-18 29h-86a20 20 0 0 1-18-29l44-92z"
            fill="url(#us-water)"/>
      <path d="M683 268h34v46l14 30h-62l14-30z" fill="#272d2d"/>
      <path d="M683 268h34v46l44 92a20 20 0 0 1-18 29h-86a20 20 0 0 1-18-29l44-92z"
            fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <rect x="678" y="262" width="44" height="9" rx="4.5" fill="#fff"/>
      <circle cx="681" cy="333" r="4" fill="#2a3132" opacity=".8"/>
      <text x="700" y="382" class="us-t" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">98%</text>
      <text x="700" y="401" class="us-t" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">PURE</text>
    </g>

    <text x="574" y="470" class="us-t us-xs" fill="#fff">Since you just smoked,</text>
    <text x="574" y="484" class="us-t us-xs" fill="#fff">the water purity was</text>
    <text x="574" y="498" class="us-t us-xs" fill="#fff">dropped by 2%</text>

    <circle cx="762" cy="470" r="17" fill="#f2c94c"/>
    <path d="M755 466q3-3 6 0M765 466q3-3 6 0" stroke="#3a3320" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M754 481q8-6 16 0" stroke="#3a3320" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M792 456v22" stroke="#e04b3a" stroke-width="3" stroke-linecap="round"/>
    <path d="M786 472l6 8 6-8z" fill="#e04b3a"/>
    <text x="792" y="503" class="us-t" font-size="16" font-weight="700" fill="#e3b04b" text-anchor="middle">2%</text>

    <rect x="574" y="536" width="252" height="30" rx="15" fill="none" stroke="#fff" stroke-width="1.4" opacity=".9"/>
    <text x="700" y="556" class="us-t" font-size="12" font-weight="500" fill="#fff" text-anchor="middle" letter-spacing="1">NEXT</text>

    <g stroke="#fff" stroke-width="1.6" fill="none" opacity=".85">
      <circle cx="606" cy="676" r="7"/><path d="M600 682l12-12"/>
      <circle cx="696" cy="672" r="5"/><path d="M688 684a8 8 0 0 1 16 0"/>
      <circle cx="712" cy="672" r="5"/><path d="M706 684a8 8 0 0 1 14 0"/>
      <circle cx="794" cy="671" r="6"/><path d="M785 684a9 9 0 0 1 18 0"/>
    </g>
  </g>
  <rect x="550" y="120" width="300" height="600" rx="34" class="us-shell"/>

  <!-- ══════════ PHONE 3 — support network + unlocks ══════════ -->
  <g clip-path="url(#us-p3)">
    <rect x="980" y="120" width="300" height="600" class="us-dark"/>

    <path d="M1004 152h16M1004 158h22M1004 164h13" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <text x="1065" y="163" class="us-t us-lbl" fill="#fff">UNSMOKE</text>
    <rect x="1148" y="151" width="9" height="13" class="us-gold"/>
    <rect x="1160" y="151" width="9" height="13" fill="#fff" opacity=".9"/>
    <rect x="1172" y="151" width="9" height="13" class="us-gold"/>
    <rect x="1184" y="151" width="9" height="13" class="us-gold"/>
    <circle cx="1246" cy="158" r="13" fill="#4a5450"/>
    <circle cx="1246" cy="153" r="4.5" fill="#c9b8a4"/>
    <path d="M1237 168a9 9 0 0 1 18 0z" fill="#c9b8a4"/>

    <text x="1004" y="208" class="us-t" font-size="15" font-weight="600" fill="#fff">Support Network</text>
    <text x="1004" y="228" class="us-t us-xs" fill="#fff" opacity=".65">You can now add more members to</text>
    <text x="1004" y="241" class="us-t us-xs" fill="#fff" opacity=".65">your community!</text>

    <rect x="1004" y="256" width="252" height="42" rx="10" class="us-cream"/>
    <circle cx="1028" cy="277" r="12" fill="#4a5450"/>
    <circle cx="1028" cy="273" r="4" fill="#c9b8a4"/>
    <path d="M1020 285a8 8 0 0 1 16 0z" fill="#c9b8a4"/>
    <text x="1050" y="282" class="us-t us-ink" font-size="12.5" font-weight="500">Your network</text>
    <text x="1206" y="282" class="us-t us-ink" font-size="14" font-weight="700" text-anchor="end">12</text>
    <path d="M1222 277h16m-6-6l6 6-6 6" stroke="#272d2d" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1004" y="308" width="252" height="28" rx="14" fill="none" stroke="#fff" stroke-width="1.3" opacity=".85"/>
    <text x="1130" y="326" class="us-t" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">ADD NOW</text>

    <text x="1004" y="374" class="us-t" font-size="14" font-weight="600" fill="#e3b04b">Educational Resources</text>

    <text x="1004" y="415" class="us-t" font-size="26" font-weight="700" fill="#e3b04b">1</text>
    <rect x="1032" y="390" width="224" height="36" rx="9" fill="none" stroke="#e3b04b" stroke-width="1.4"/>
    <text x="1046" y="405" class="us-t us-xs" fill="#e3b04b">Health benefits and</text>
    <text x="1046" y="418" class="us-t us-xs" fill="#e3b04b">coping techniques</text>

    <text x="1004" y="466" class="us-t" font-size="26" font-weight="700" fill="#e3b04b">2</text>
    <rect x="1032" y="441" width="224" height="36" rx="9" class="us-gold"/>
    <text x="1078" y="464" class="us-t" font-size="11" font-weight="600" fill="#3a3320" text-anchor="middle" letter-spacing=".5">UNLOCKED!</text>
    <g transform="translate(1146,450)" stroke="#3a3320" stroke-width="1.8" fill="none">
      <rect x="0" y="7" width="14" height="11" rx="2"/><path d="M3 7V4a4 4 0 0 1 8 0v3"/>
    </g>
    <path d="M1214 459h16m-6-6l6 6-6 6" stroke="#3a3320" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1004" y="517" class="us-t" font-size="26" font-weight="700" fill="#6b7370">3</text>
    <rect x="1032" y="492" width="224" height="36" rx="9" fill="none" stroke="#6b7370" stroke-width="1.4"/>
    <g transform="translate(1137,502)" stroke="#9aa19d" stroke-width="1.8" fill="none">
      <rect x="0" y="7" width="14" height="11" rx="2"/><path d="M3 7V4a4 4 0 0 1 8 0v3"/>
    </g>

    <g stroke="#fff" stroke-width="1.6" fill="none" opacity=".85">
      <circle cx="1036" cy="676" r="7"/><path d="M1030 682l12-12"/>
      <circle cx="1126" cy="672" r="5"/><path d="M1118 684a8 8 0 0 1 16 0"/>
      <circle cx="1142" cy="672" r="5"/><path d="M1136 684a8 8 0 0 1 14 0"/>
      <circle cx="1224" cy="671" r="6"/><path d="M1215 684a9 9 0 0 1 18 0"/>
    </g>
  </g>
  <rect x="980" y="120" width="300" height="600" rx="34" class="us-shell"/>
</svg>
